<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>robot — mascot showcase</title>
<style>
  :root { color-scheme: light; }
  body { font:14px system-ui,sans-serif; margin:0; color:#1d2533; background:#eef3f8; display:flex; min-height:100vh; }
  #stage { flex:1; display:grid; place-items:center; padding:24px; }
  #stage svg { width:min(60vw,420px); height:auto; filter:drop-shadow(0 6px 18px rgba(20,40,80,.15)); }
  #panel { width:260px; padding:20px; background:#fff; border-left:1px solid #d6dce8; display:flex; flex-direction:column; gap:14px; }
  #panel h3 { margin:0; font-size:16px; }
  #panel p { margin:0; color:#5a6678; }
  .btns { display:flex; flex-wrap:wrap; gap:6px; }
  .btns button { flex:1 0 auto; padding:8px 10px; cursor:pointer; border:1px solid #c3ccde; border-radius:6px; background:#f6f8fc; }
  .btns button.active { background:#1d6fe0; color:#fff; border-color:#1d6fe0; }
  #play { padding:9px; cursor:pointer; border:0; border-radius:6px; background:#16324f; color:#fff; font-weight:600; }
  #dl { padding:9px; text-align:center; text-decoration:none; border:1px solid #1d6fe0; border-radius:6px; color:#1d6fe0; }
  #source img { width:100%; image-rendering:auto; border:1px solid #d6dce8; border-radius:6px; background:#eef3f8; }
  @media (prefers-reduced-motion: reduce) { #play { opacity:.6; } }
</style></head>
<body>
  <div id="stage"><svg id="mascot" data-state="idle" data-states="idle,active,alert" data-render-method="ccl-color-threshold" data-source-bounds="46,0,154,208" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" shape-rendering="crispEdges" role="img" aria-labelledby="title desc">
  <style>
#mascot .part { transform-box: fill-box; transition: transform 160ms ease, opacity 120ms ease; }
#mascot #part-antenna { transform-origin: 50% 50%; }
#mascot #part-head { transform-origin: 50% 50%; }
#mascot #part-body { transform-origin: 50% 50%; }
#mascot #part-left-arm { transform-origin: 50% 0%; }
#mascot #part-right-arm { transform-origin: 50% 0%; }
#mascot #part-left-leg { transform-origin: 50% 0%; }
#mascot #part-right-leg { transform-origin: 50% 0%; }
#mascot[data-state="idle"] #part-antenna { animation: part-antenna__twitch 3200ms ease-in-out infinite; }
#mascot[data-state="idle"] #part-head { animation: part-head__glance 4000ms ease-in-out infinite; }
#mascot[data-state="idle"] #part-body { animation: part-body__breathe 1800ms ease-in-out infinite; }
#mascot[data-state="active"] #part-left-arm { animation: part-left-arm__walk 520ms ease-in-out infinite; }
#mascot[data-state="active"] #part-right-arm { animation: part-right-arm__walk-mirror 520ms ease-in-out infinite; }
#mascot[data-state="active"] #part-left-leg { animation: part-left-leg__walk-mirror 520ms ease-in-out infinite; }
#mascot[data-state="active"] #part-right-leg { animation: part-right-leg__walk 520ms ease-in-out infinite; }
#mascot[data-state="alert"] #part-antenna { animation: part-antenna__pulse 420ms ease-in-out infinite; }
#mascot[data-state="alert"] #part-head { animation: part-head__nod 900ms ease-in-out infinite; }
@keyframes part-antenna__twitch {
  0%, 88%, 100% { transform: rotate(0deg); }
  92% { transform: rotate(-9deg); }
  96% { transform: rotate(6deg); }
}
@keyframes part-head__glance {
  0%, 30%, 100% { transform: translateX(0); }
  45% { transform: translateX(-2px); }
  70% { transform: translateX(2px); }
}
@keyframes part-body__breathe {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(.985, 1.035); }
}
@keyframes part-left-arm__walk {
  0%, 100% { transform: rotate(14deg); }
  50% { transform: rotate(-18deg); }
}
@keyframes part-right-arm__walk-mirror {
  0%, 100% { transform: rotate(-14deg); }
  50% { transform: rotate(18deg); }
}
@keyframes part-left-leg__walk-mirror {
  0%, 100% { transform: rotate(-14deg); }
  50% { transform: rotate(18deg); }
}
@keyframes part-right-leg__walk {
  0%, 100% { transform: rotate(14deg); }
  50% { transform: rotate(-18deg); }
}
@keyframes part-antenna__pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.16); }
}
@keyframes part-head__nod {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(10deg); }
}
@media (prefers-reduced-motion: reduce) {
  #mascot .part { animation: none !important; transition: none !important; }
  #mascot[data-state="idle"] #part-body { transform: scale(1); }
  #mascot[data-state="active"] #part-left-arm { transform: rotate(10deg); }
  #mascot[data-state="active"] #part-right-arm { transform: rotate(-10deg); }
  #mascot[data-state="active"] #part-left-leg { transform: rotate(-10deg); }
  #mascot[data-state="active"] #part-right-leg { transform: rotate(10deg); }
  #mascot[data-state="alert"] #part-antenna { transform: scale(1.08); }
}
#mascot.force-reduced-motion .part { animation: none !important; transition: none !important; }
#mascot.force-reduced-motion[data-state="idle"] #part-body { transform: scale(1); }
#mascot.force-reduced-motion[data-state="active"] #part-left-arm { transform: rotate(10deg); }
#mascot.force-reduced-motion[data-state="active"] #part-right-arm { transform: rotate(-10deg); }
#mascot.force-reduced-motion[data-state="active"] #part-left-leg { transform: rotate(-10deg); }
#mascot.force-reduced-motion[data-state="active"] #part-right-leg { transform: rotate(10deg); }
#mascot.force-reduced-motion[data-state="alert"] #part-antenna { transform: scale(1.08); }
  </style>

  <script>
    var svg = document.querySelector('#stage svg');
    var states = ["idle","active","alert"];
    var btns = Array.prototype.slice.call(document.querySelectorAll('[data-s]'));
    function show(s) {
      svg.setAttribute('data-state', s);
      btns.forEach(function (b) { b.classList.toggle('active', b.dataset.s === s); });
    }
    btns.forEach(function (b) { b.onclick = function () { stop(); show(b.dataset.s); }; });
    show(states[0]);
    var timer = null, i = 0;
    var play = document.getElementById('play');
    function stop() { if (timer) { clearInterval(timer); timer = null; play.textContent = '▶ Play feed'; play.setAttribute('aria-pressed', 'false'); } }
    function start() {
      timer = setInterval(function () { i = (i + 1) % states.length; show(states[i]); }, 1400);
      play.textContent = '⏸ Pause'; play.setAttribute('aria-pressed', 'true');
    }
    play.onclick = function () { timer ? stop() : start(); };
    if (!window.matchMedia || !window.matchMedia('(prefers-reduced-motion: reduce)').matches) start();
  </script>
