<title>smiley — mascot showcase</title>
<style>
  :root { color-scheme: light; }
  body { font:14px system-ui,sans-serif; margin:0; color:#1d2533; background:#eef3f8; display:flex; min-height:100vh; }
  #stage { flex:1; display:grid; place-items:center; padding:24px; }
  #stage svg { width:min(60vw,420px); height:auto; filter:drop-shadow(0 6px 18px rgba(20,40,80,.15)); }
  #panel { width:260px; padding:20px; background:#fff; border-left:1px solid #d6dce8; display:flex; flex-direction:column; gap:14px; }
  #panel h3 { margin:0; font-size:16px; }
  #panel p { margin:0; color:#5a6678; }
  .btns { display:flex; flex-wrap:wrap; gap:6px; }
  .btns button { flex:1 0 auto; padding:8px 10px; cursor:pointer; border:1px solid #c3ccde; border-radius:6px; background:#f6f8fc; }
  .btns button.active { background:#1d6fe0; color:#fff; border-color:#1d6fe0; }
  #play { padding:9px; cursor:pointer; border:0; border-radius:6px; background:#16324f; color:#fff; font-weight:600; }
  #dl { padding:9px; text-align:center; text-decoration:none; border:1px solid #1d6fe0; border-radius:6px; color:#1d6fe0; }
  #source img { width:100%; image-rendering:auto; border:1px solid #d6dce8; border-radius:6px; background:#eef3f8; }
  @media (prefers-reduced-motion: reduce) { #play { opacity:.6; } }
</style></head>

  <div id="stage"><svg id="mascot" data-state="idle" data-states="idle,active,alert" data-render-method="ccl-color-threshold" data-source-bounds="6,18,84,78" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 90" shape-rendering="crispEdges" role="img" aria-labelledby="title desc">
  <style>
#mascot .part { transform-box: fill-box; transition: transform 160ms ease, opacity 120ms ease; }
#mascot #part-body { transform-origin: 50% 50%; }
#mascot #part-eyes { transform-origin: 50% 50%; }
#mascot #part-hand-left { transform-origin: 50% 0%; }
#mascot #part-hand-right { transform-origin: 50% 0%; }
#mascot #part-tongue { transform-origin: 50% 50%; }
#mascot[data-state="idle"] #part-body { animation: part-body__breathe 1800ms ease-in-out infinite; }
#mascot[data-state="idle"] #part-eyes { animation: part-eyes__blink 4200ms step-end infinite; }
#mascot[data-state="active"] #part-hand-left { animation: part-hand-left__walk 520ms ease-in-out infinite; }
#mascot[data-state="active"] #part-hand-right { animation: part-hand-right__walk-mirror 520ms ease-in-out infinite; }
#mascot[data-state="alert"] #part-tongue { animation: part-tongue__pulse 420ms ease-in-out infinite; }
@keyframes part-body__breathe {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(.985, 1.035); }
}
@keyframes part-eyes__blink {
  0%, 92%, 100% { transform: scaleY(1); }
  94%, 96% { transform: scaleY(.12); }
}
@keyframes part-hand-left__walk {
  0%, 100% { transform: rotate(14deg); }
  50% { transform: rotate(-18deg); }
}
@keyframes part-hand-right__walk-mirror {
  0%, 100% { transform: rotate(-14deg); }
  50% { transform: rotate(18deg); }
}
@keyframes part-tongue__pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.16); }
}
@media (prefers-reduced-motion: reduce) {
  #mascot .part { animation: none !important; transition: none !important; }
  #mascot[data-state="idle"] #part-body { transform: scale(1); }
  #mascot[data-state="active"] #part-hand-left { transform: rotate(10deg); }
  #mascot[data-state="active"] #part-hand-right { transform: rotate(-10deg); }
  #mascot[data-state="alert"] #part-tongue { transform: scale(1.08); }
}
#mascot.force-reduced-motion .part { animation: none !important; transition: none !important; }
#mascot.force-reduced-motion[data-state="idle"] #part-body { transform: scale(1); }
#mascot.force-reduced-motion[data-state="active"] #part-hand-left { transform: rotate(10deg); }
#mascot.force-reduced-motion[data-state="active"] #part-hand-right { transform: rotate(-10deg); }
#mascot.force-reduced-motion[data-state="alert"] #part-tongue { transform: scale(1.08); }
  </style>

  <script>
    var svg = document.querySelector('#stage svg');
    var states = ["idle","active","alert"];
    var btns = Array.prototype.slice.call(document.querySelectorAll('[data-s]'));
    function show(s) {
      svg.setAttribute('data-state', s);
      btns.forEach(function (b) { b.classList.toggle('active', b.dataset.s === s); });
    }
    btns.forEach(function (b) { b.onclick = function () { stop(); show(b.dataset.s); }; });
    show(states[0]);
    var timer = null, i = 0;
    var play = document.getElementById('play');
    function stop() { if (timer) { clearInterval(timer); timer = null; play.textContent = '▶ Play feed'; play.setAttribute('aria-pressed', 'false'); } }
    function start() {
      timer = setInterval(function () { i = (i + 1) % states.length; show(states[i]); }, 1400);
      play.textContent = '⏸ Pause'; play.setAttribute('aria-pressed', 'true');
    }
    play.onclick = function () { timer ? stop() : start(); };
    if (!window.matchMedia || !window.matchMedia('(prefers-reduced-motion: reduce)').matches) start();
  </script>
